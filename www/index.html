<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Flux RSS</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="img/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <div id="hero">
      <div>
        <div id="hero-title">Flux RSS <span id="app-ver"></span></div>
        <div id="hero-sub">📰 Veille multi-thèmes</div>
      </div>
      <div class="hdr-btns">
        <button id="lang-btn" title="Langue des sources" aria-label="Langue des sources">🇫🇷</button>
        <button id="settings-btn" title="Réglages" aria-label="Réglages">⚙️</button>
      </div>
    </div>
    <div id="cats" class="chips"></div>
    <div id="subtabs" class="subtabs" hidden></div>
    <div id="status" class="status"></div>
  </header>

  <div id="modal" class="modal" hidden><div id="modal-card" class="modal-card"></div></div>

  <main id="main">
    <div id="rugby-live" hidden></div>
    <div id="changelog-live" hidden></div>
    <div id="football-live" hidden></div>
    <div id="placement-live" hidden></div>
    <div id="articles"></div>
  </main>

  <button id="refresh" title="Actualiser" aria-label="Actualiser">⟳</button>

  <script src="app.js"></script>
  <script>window.UPDATE_REPO='laurentsar/flux-rss';window.APP_VERSION='5.14';</script>
  <script src="update-check.js" defer></script>
</body>
</html>
